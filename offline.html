<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <title>目前離線 - 台南資料</title>
  <style>
    :root { color-scheme: light dark; --bg:#f0fdfa; --fg:#134e4a; --card:#fff; --muted:#5f7a77; --pri:#0d9488; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1f1e; --fg:#ccfbf1; --card:#12302e; --muted:#8db5b0; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center;
           padding:max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
           background:var(--bg); color:var(--fg);
           font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
    .card { width:min(92vw, 420px); background:var(--card); border-radius:20px; padding:32px 24px;
            text-align:center; box-shadow:0 10px 30px rgba(13,148,136,.15); }
    .icon { font-size:3.2rem; }
    h1 { font-size:clamp(1.3rem, 5vw, 1.7rem); margin:.4em 0 .2em; }
    p { color:var(--muted); line-height:1.7; margin:0 0 1.4em; }
    button { appearance:none; border:0; background:var(--pri); color:#fff; font:inherit; font-weight:600;
             padding:12px 28px; min-height:44px; border-radius:12px; cursor:pointer; }
    button:active { transform:scale(.97); }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📡</div>
    <h1>目前沒有網路連線</h1>
    <p>開放資料需要連線才能載入。<br>請確認網路後再重試。</p>
    <button onclick="location.reload()">重新連線</button>
  </main>
  <script>window.addEventListener("online", () => location.replace("/"));</script>
</body>
</html>
